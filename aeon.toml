# hexgrid-3d — easy-deploy site (driven entirely by this file).
#
# Deploy with:  a0 xr deploy
#
# hexgrid-3d has no worker `main`; the [site] block makes it a topology-driven
# site. x-ranger synthesizes a worker that renders this content with the
# `oss-template` component kit via the @a0n/aeon-flux runtime.
#
# Content is sourced from open-source/hexgrid-3d/README.md — keep it honest.

name = "hexgrid-3d-site"
compatibility_date = "2025-01-01"
workers_dev = true

[site]
kit = "oss-template"
title = "hexgrid-3d — immersive 3D hexagonal grid for React"

[site.project]
name = "HexGrid 3D"
tagline = "A spherical hexagonal grid you can fly through."
description = "A reusable 3D hexagonal grid visualization component for React. It projects content onto a curved spherical surface with interactive camera controls, image texture mapping, and a Web Worker rendering pipeline tuned for 60fps."
logo = "hex"
accent = "#59d0ff"
theme = "dark"
font_sans = "Atkinson Hyperlegible Next"
font_serif = "IBM Plex Serif"
repo = "forkjoin-ai/hexgrid-3d"

[site.nav]
links = ["Features|#features", "Quickstart|#quickstart", "FAQ|#faq", "Source|https://forgo.cloud/forkjoin-ai/hexgrid-3d"]

[site.sigil]
seed = "hexgrid-3d"
motion = "drift"
coherence = "ring"
frame = "hexagon"

[site.hero]
eyebrow = "3D · spherical · React Three Fiber · Web Worker"
install = "npm install @buley/hexgrid-3d"
cta_primary = "Get started"
cta_primary_href = "#quickstart"
cta_secondary = "Browse the source"
cta_secondary_href = "https://forgo.cloud/forkjoin-ai/hexgrid-3d"

[[site.features]]
icon = "globe"
title = "3D hexagonal grid layout"
body = "Spherical projection with customizable curvature, rendering tiles across a curved globe surface for an immersive, depth-aware layout."

[[site.features]]
icon = "gauge"
title = "Interactive camera controls"
body = "Pan, zoom, and inside/outside views with smooth transitions. Mouse, trackpad, touch gestures, and keyboard input are all supported out of the box."

[[site.features]]
icon = "layers"
title = "Image texture mapping"
body = "Automatic texture loading and caching maps photos onto hex tiles, with dynamic accent-color extraction from the images themselves."

[[site.features]]
icon = "cpu"
title = "Web Worker rendering"
body = "Heavy calculations are offloaded to a Web Worker to hold 60fps, with streaming progressive rendering, texture caching, adaptive quality, and an optional low-res mode."

[[site.features]]
icon = "zap"
title = "Hardware acceleration"
body = "Supports WebNN (NPU) and WebGPU for massive fluid and particle simulation on top of the grid."

[[site.features]]
icon = "branch"
title = "Territory globe"
body = "Deterministic wrapped globe topology for paid root claims, recursive subdivision, and delegated territory overlays via HexTerritoryGlobe and generateCanonicalHexGlobe."

[site.quickstart]
title = "Render a grid"

[[site.quickstart.tab]]
label = "Basic"
code = "import { HexGrid, Photo } from \"@buley/hexgrid-3d\";\n\nfunction MyComponent() {\n  const photos: Photo[] = [\n    {\n      id: \"1\",\n      url: \"https://example.com/photo.jpg\",\n      source: \"example\",\n      createdAt: new Date().toISOString(),\n    },\n  ];\n\n  return (\n    <HexGrid\n      photos={photos}\n      onHexClick={(photo) => console.log(\"Clicked:\", photo)}\n    />\n  );\n}"

[[site.quickstart.tab]]
label = "Controls"
code = "import { HexGrid, uiStore } from \"@buley/hexgrid-3d\";\n\n<button onClick={() => uiStore.toggleDebug()}>Toggle Debug</button>\n<button onClick={() => uiStore.toggleCamera()}>Camera Controls</button>\n\n<HexGrid\n  photos={photos}\n  spacing={1.2}\n  autoplayQueueLimit={100}\n  onHexClick={(photo) => setModalOpen(true)}\n/>"

[[site.quickstart.tab]]
label = "Territory"
code = "import {\n  HexTerritoryGlobe,\n  generateCanonicalHexGlobe,\n} from \"@buley/hexgrid-3d\";\n\nconst board = generateCanonicalHexGlobe({\n  boardId: \"main\",\n  curveUDeg: 360,\n  curveVDeg: 180,\n  rowCount: 180,\n  equatorColumns: 288,\n});\n\n<HexTerritoryGlobe\n  cells={board.cells}\n  claimedCellIds={new Set([\"main:r90:c144\"])}\n  colorsByCellId={{ \"main:r90:c144\": \"#59d0ff\" }}\n/>"

[[site.faq]]
q = "What does HexGrid 3D render?"
a = "A 3D hexagonal grid on a spherical surface. Each hex tile can display a photo with an image texture, and the camera can move inside or outside the globe with smooth transitions."

[[site.faq]]
q = "How does it stay at 60fps?"
a = "Heavy layout and projection calculations run in a Web Worker. The component streams tiles progressively, caches loaded textures, adapts quality to performance, and offers a low-res mode for slower devices."

[[site.faq]]
q = "What is the Territory Globe?"
a = "A deterministic wrapped globe topology for paid root claims, recursive subdivision, and delegated territory overlays. generateCanonicalHexGlobe builds canonical cells and HexTerritoryGlobe renders territory-aware hex cells, auto-fitting row-safe tile radii when tileRadius is omitted."

[[site.faq]]
q = "What does it depend on?"
a = "Peer dependencies are React, react-dom, Next.js, three, and @react-three/fiber. The package targets React 18+ and React Three Fiber 9.4+."

